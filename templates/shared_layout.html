<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Popularidade de Jogos{% endblock %}</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; color: #222; }
        header { background: #222; color: white; padding: 16px 24px; }
        header h1 { margin: 0 0 12px; font-size: 22px; }
        nav { display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 1050px; margin: 24px auto; padding: 0 18px; }
        section { background: white; padding: 20px; margin-bottom: 18px; border-radius: 6px; }
        h2, h3 { margin-top: 0; }
        button, .link-button { display: inline-block; border: 0; border-radius: 4px; padding: 10px 14px; background: #2563eb; color: white; text-decoration: none; cursor: pointer; }
        button:hover, .link-button:hover { background: #1d4ed8; }
        input, select { font: inherit; }
        .mensagem { padding: 10px; border-radius: 4px; }
        .mensagem.sucesso { background: #e2f5e8; color: #166534; }
        .mensagem.erro { background: #fee2e2; color: #991b1b; }
        .erro { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 4px; }
        .resumo { display: flex; flex-wrap: wrap; gap: 12px; }
        .resumo div { background: #f1f5f9; padding: 12px; min-width: 130px; border-radius: 4px; }
        .resumo strong { display: block; font-size: 20px; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f1f5f9; }
        .tabela { overflow-x: auto; }
        .grafico { display: block; width: 100%; max-width: 850px; height: auto; margin: 12px auto; }
        .ajuda { color: #555; font-size: 14px; }
        @media (max-width: 600px) { header { padding: 14px; } nav { gap: 14px; flex-wrap: wrap; } }
    </style>
</head>
<body>
    <header>
        <h1>Popularidade de Jogos (Steam)</h1>
        <nav>
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('analise') }}">Análise</a>
            <a href="{{ url_for('previsao') }}">Previsão</a>
        </nav>
    </header>
    <main>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <p class="mensagem {{ categoria }}">{{ mensagem }}</p>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
